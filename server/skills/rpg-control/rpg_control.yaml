wantType:
  metadata:
    name: rpg_control
    title: RPG Control
    description: |
      rpg-server に対してゲームアクション (open / activate / move / pickup / advance / return など) を実行する。
      既定の実行者は chap で、you から拒否されたアクションを代行する用途。actor に you を
      指定すれば、移動・取得・ステージ間の移動 (advance / return) も呼べる。
      誰が何を実行できるかは docs/actions.md を参照。
    version: '1.0'
    category: rpg
    pattern: independent
    labels:
      child-role: doer
      category-icon: "Swords"
      category-bg-light: "linear-gradient(160deg, #fca5a5 0%, #fde8d8 100%)"
      category-bg-dark: "linear-gradient(160deg, #b91c1c 0%, #7f1d1d 100%)"

  finalResultField: summary

  parameters:
    - name: actor
      description: 実行者。chap（扉・デバイス）か you（移動・取得・advance / return）
      type: string
      required: false
      default: chap
    - name: action
      description: ゲームアクション名（observe / move / pickup / open など）
      type: string
      required: true
    - name: target
      description: 対象（door id / item id / waypoint id など）
      type: string
      required: false
    - name: args
      description: アクション固有の追加引数
      type: object
      required: false

  state:
    - { name: skill_json_arg,        description: JSON arg passed to main.py, type: string, label: current, persistent: false, initialValue: "" }
    - { name: actor,                 description: actor (mirror), type: string, label: current, persistent: false, initialValue: "" }
    - { name: action,                description: action (mirror), type: string, label: current, persistent: false, initialValue: "" }
    - { name: target,                description: target (mirror), type: string, label: current, persistent: false, initialValue: "" }
    - { name: args,                  description: args (mirror), type: object, label: current, persistent: false, initialValue: {} }
    - { name: error,                 description: error message if failed, type: string, label: current, persistent: true, initialValue: "" }
    - { name: summary,               description: summary text, type: string, label: current, persistent: true, initialValue: "" }
    - { name: achieving_percentage,  description: 0-100 progress, type: int, label: current, persistent: false, initialValue: 0 }

  finalizeWhen:
    achieved:
      field: mrs_raw_output
      operator: "!="
      value: null
    failed:
      field: error
      operator: "!="
      value: ""

  onInitialize:
    current:
      skill_json_arg: '{"actor":"${actor}","action":"${action}","target":"${target}","args":${args}}'

  requires:
    - rpg_control

  examples:
    - name: ask chap to open door1
      description: chap が door1 を開ける
      want:
        metadata: { name: ask-chap-open-door1, type: rpg_control }
        spec:
          params: { action: open, target: door1 }

    - name: send you to the next stage
      description: クリア済みのステージから次へ進む（両ステージはそのまま残る）
      want:
        metadata: { name: go-next-stage, type: rpg_control }
        spec:
          params: { actor: you, action: advance }
