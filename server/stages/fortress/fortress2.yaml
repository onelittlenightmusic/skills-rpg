id: fortress2
title: "The Name That Vanishes"
description: |
  A redaction crew is already at the gate, scraping her name back off it.
  A name nothing refers to is not on the board. Pinning is the answer, and it is
  not a convenience.
initial_position: gate_arch
waypoints:
  gate_arch:
    label: "The Gate Arch"
    adjacent: [pump_yard]
  pump_yard:
    label: "Pump Yard"
    adjacent: [gate_arch]
items:
  lira_mark:
    held_by: you
    value: "Lira"
devices:
  redaction_crew:
    label: "Imperial Redaction Crew"
    on: true
doors:
  yard_door:
    between: [gate_arch, pump_yard]
    open: false
    locked: true
    # Not a lock that a key opens: the door reads the board, and a name that is
    # merely referred to is one the crews can take away — so this one asks for a
    # name that stands on its own.
    requires_thing_pinned:
      subtype: maker
      from_item: lira_mark
achievement_defs:
  - id: saw_the_crew
    when: { action: observe }
  - id: named_again
    when: { actor: you, action: name_thing, subtype: maker, result: ok }
  - id: pinned_lira
    when: { actor: you, action: pin_thing, subtype: maker, result: ok }
  - id: through_the_yard_door
    when: { actor: you, action: move, target: pump_yard, result: ok }
next_goal_rules:
  - if_missing: saw_the_crew
    goal:
      text: "Something is happening at the gate behind you"
      hint: "Look back. rpg_observe"
      required_skill: rpg-observe
  - if_missing: named_again
    goal:
      text: "Her name is gone from the board. Put it back"
      hint: "Name it again — the mark is still yours, and they cannot take that"
  - if_missing: pinned_lira
    goal:
      text: "It will go again when they come round. Make it stay"
      hint: "Pin the thing. A pinned value stands on the board whether or not anything refers to it"
  - if_missing: through_the_yard_door
    goal:
      text: "The yard door only answers a name that stays. Go through"
      hint: "rpg_control_system actor=you action=move target=pump_yard"
cleared_when: through_the_yard_door
next_stage: fortress3
narrations:
  - match:
      action: observe
      requires_achievements: [through_the_yard_door]
    situation: |
      The crew worked the gate over a second time, thoroughly, and left.
      Her tile is still standing on the board.
    conversations:
      - speaker: you
        text: "They did the same thing. It didn't work."
      - speaker: chap
        text: "It worked exactly as before — the gate no longer refers to her. But the board is not showing her because the gate refers to her. It is showing her because you said she stands there."
      - speaker: you
        text: "So that's what they were relying on. That her name was only ever borrowed."
    lore: |
      A value is drawn on the board when something refers to it — or when you have
      pinned it. The first is contingent on somebody else. The second is not.
      The Empire's whole method lived in that first clause, and the answer to it
      is one deliberate act.

  - match:
      action: observe
      requires_achievements: [pinned_lira]
      missing_achievements: [through_the_yard_door]
    conversations:
      - speaker: chap
        text: "The tile is pinned. Nothing refers to her at this moment, and she is still on the board."
      - speaker: you
        text: "Then let them come."

  - match:
      action: observe
      requires_achievements: [saw_the_crew]
      missing_achievements: [named_again]
    situation: |
      Where the tile stood there is board and nothing else. The gate stands open —
      they did not close it, they do not care about the gate — and the road that
      ran to it is gone with the name.
    conversations:
      - speaker: you
        text: "It's been five minutes."
      - speaker: chap
        text: "The name still exists. The city was told it and has not forgotten. But nothing refers to it now, so there is nothing to draw."
      - speaker: you
        text: "They don't have to destroy anything. They just have to keep tidying."

  - match: { action: observe }
    situation: |
      Two clerks and a foreman, in Imperial grey, working unhurriedly at the gate
      you came through. One of them is reading a list. They have the manner of
      people doing a scheduled round.
    conversations:
      - speaker: you
        text: "What are they doing to it?"
      - speaker: chap
        text: "Clearing the maker field. The same field you filled."
      - speaker: you
        text: "This is a job. Somebody does this all week."
    lore: |
      [The roster nailed inside the gatehouse, current]
      NORTH QUARTER — REFERENCE MAINTENANCE
      Gates, pumps, lifts. Clear maker fields. Report any re-entry.
      Second shift covers the ward.
      This is not a purge. A purge ends.

  # The scrape itself is narrated, not simulated: an actor that is neither you
  # nor chap does not exist in the action model, and inventing one to stage a
  # cutscene is a bigger change than this beat is worth. What the stage enforces
  # is the part that matters — the yard door will not take a borrowed name.
  # See docs/world-fortress.md for the rpg_redactor that would let the tile
  # actually vanish and come back.
  - match: { action: observe, missing_achievements: [named_again] }
    on_success: |
      The foreman reaches into the gate's mechanism, and the field you filled
      goes blank. Nothing dramatic happens — the gate is still open, still
      working. On the board, her tile simply is not there any more.
    conversations:
      - speaker: chap
        text: "Her name is no longer referred to by anything in this district."
      - speaker: you
        text: "And so it isn't anywhere."

  - match: { actor: you, action: pin_thing, subtype: maker, result: ok }
    on_success: |
      You put her name down on the board yourself, in a place you chose, and it
      stays there — not because the gate is using it, not because anything is.
      Because you said so.
    conversations:
      - speaker: you
        text: "She's not borrowing space from a gate any more."
      - speaker: chap
        text: "No. She is on the board on her own account."
    lore: |
      They never destroyed her name. They made it contingent — present only while
      something happened to refer to it — and then they went round removing the
      references, and they are still going round.
      A pin is the undoing of that, and it takes one press.

locales:
  ja:
    title: "消える名前"
    description: |
      削除班がもう門に取りついていて、彼女の名前を削り直している。
      何にも参照されていない名前は盤面に無い。答えは pin で、
      そしてそれは便利機能ではない。
    waypoints:
      gate_arch: { label: "門の下" }
      pump_yard: { label: "ポンプ広場" }
    next_goal_rules:
      - goal:
          text: "背後の門で何かが起きている"
          hint: "振り返る。rpg_observe"
      - goal:
          text: "彼女の名前が盤面から消えた。戻そう"
          hint: "もう一度名付ける——刻印はまだこちらの手にあり、それは奪えない"
      - goal:
          text: "次の巡回でまた消える。留まるようにしよう"
          hint: "thing を pin する。pin された値は、何かに参照されているかどうかに関係なく盤面に立つ"
      - goal:
          text: "次の巡回を待とう"
          hint: "彼らは門を削る。今度はタイルがどうなるかを見る"
    narrations:
      - situation: |
          削除班は門を二度目に、丁寧に処理して去った。
          彼女のタイルは、まだ盤面に立っている。
        conversations:
          - speaker: you
            text: "同じことをやったのに、効かなかった。"
          - speaker: chap
            text: "前回と全く同じに効いています——門はもう彼女を参照していません。ですが盤面が彼女を映しているのは、門が参照しているからではありません。あなたがそこに立つと言ったからです。"
          - speaker: you
            text: "それが連中の頼りにしてたものか。名前がずっと借り物だったってことが。"
        lore: |
          値が盤面に描かれるのは、何かがそれを参照しているとき——あるいは
          こちらが pin したときだ。前者は他人任せで、後者はそうではない。
          帝国のやり方は全部その前者の条件の中に住んでいて、
          それへの答えは、意図的な一手で足りる。
      - conversations:
          - speaker: chap
            text: "タイルは pin されています。今この瞬間、彼女を参照しているものは何もありません。そして彼女は盤面にいます。"
          - speaker: you
            text: "なら、来ればいい。"
      - situation: |
          タイルのあった場所には盤面があるだけだ。門は開いたまま——
          閉じてはいない、彼らは門に興味が無い——そしてそこへ伸びていた道が、
          名前ごと消えている。
        conversations:
          - speaker: you
            text: "五分だ。"
          - speaker: chap
            text: "名前自体は存在しています。都市は伝えられて、忘れてはいません。ですが今それを参照するものが無いので、描くものが無いのです。"
          - speaker: you
            text: "壊す必要すらない。片付け続ければいいだけだ。"
      - situation: |
          帝国の灰色を着た書記が二人と現場監督が一人、
          さっきくぐった門で、急ぐでもなく作業している。一人は一覧を読んでいる。
          予定された巡回をこなす者の手つきだ。
        conversations:
          - speaker: you
            text: "何をしてる？"
          - speaker: chap
            text: "作り手の欄を空にしています。あなたが埋めた欄です。"
          - speaker: you
            text: "これは仕事だ。誰かが一週間これをやってる。"
        lore: |
          【門番小屋の内側に打ち付けられた勤務表、現行】
          北区——参照保守
          門・ポンプ・昇降機。作り手欄を消去。再記入は報告のこと。
          第二班が区を担当。
          これは粛清ではない。粛清には終わりがある。
      - on_success: |
          監督が門の機構に手を入れ、あなたが埋めた欄が空になる。
          劇的なことは何も起きない——門は開いたままだし、動いてもいる。
          盤面から、彼女のタイルがただ無くなっただけだ。
        conversations:
          - speaker: chap
            text: "彼女の名前は、この区画のどれからも参照されなくなりました。"
          - speaker: you
            text: "つまり、どこにも無い。"
      - on_success: |
          あなたは彼女の名前を、自分で選んだ場所に、自分の手で盤面に置いた。
          そしてそれは留まる——門が使っているからでも、何かが使っているからでもなく。
          あなたがそう言ったからだ。
        conversations:
          - speaker: you
            text: "もう門から場所を借りてない。"
          - speaker: chap
            text: "はい。彼女は彼女自身の名義で盤面にいます。"
        lore: |
          彼らは彼女の名前を破壊しなかった。参照されている間だけ存在するものにして、
          そのうえで参照を剥がして回った。そして今も回っている。
          pin はその取り消しであり、一回押せば済む。
